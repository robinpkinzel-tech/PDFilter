name: Build & Test (macOS)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build, Test, App-Bundle
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain anzeigen
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Bauen (Debug)
        run: swift build -v 2>&1 | tail -n 200

      - name: Tests
        run: swift test 2>&1 | tail -n 800

      - name: Absturz-Diagnose (nur bei Fehler)
        if: failure()
        run: |
          sleep 8
          ls -t ~/Library/Logs/DiagnosticReports/ /Library/Logs/DiagnosticReports/ 2>/dev/null | head -n 30 || true
          for f in $(ls -t ~/Library/Logs/DiagnosticReports/*.ips /Library/Logs/DiagnosticReports/*.ips 2>/dev/null | head -n 2); do
            echo "=== $f"
            python3 Scripts/crashreport.py "$f" || head -c 6000 "$f"
          done
          XCTEST="$(xcode-select -p)/usr/bin/xctest"
          BUNDLE=$(ls -d .build/*/debug/PDFilterPackageTests.xctest | head -n 1)
          echo "=== lldb: $BUNDLE"
          lldb --batch -o run -o "bt 60" -o "thread list" -o quit -- "$XCTEST" -XCTest 'PDFilterParsingTests.DateTests/testIsoAndDotSpacing' "$BUNDLE" 2>&1 | tail -n 150 || true

      - name: App-Bundle erzeugen (Release)
        run: Scripts/make-app.sh

      - name: App zippen
        run: |
          cd build
          ditto -c -k --keepParent PDFilter.app PDFilter.app.zip
          ls -la

      - name: App als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: PDFilter-macOS
          path: build/PDFilter.app.zip
          if-no-files-found: error
          retention-days: 30
